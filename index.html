<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Jake's Day</title>
<meta name="description" content="Jake's weekly schedule — school, homework, activities and free time." />
<meta name="theme-color" content="#0b0d17" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jake's Day" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="banner" class="banner banner-incomplete" role="status" aria-live="polite">
  <div class="banner-stripes" aria-hidden="true"></div>
  <div class="banner-inner">
    <span class="banner-icon" aria-hidden="true">🏎️</span>
    <span class="banner-text" id="bannerText">Incomplete = No Driving</span>
    <span class="banner-icon" aria-hidden="true">🏎️</span>
  </div>
</div>

<header class="app-header">
  <div class="header-titles">
    <h1 id="appTitle">Jake's Day</h1>
    <p id="appSubtitle" class="app-subtitle"></p>
  </div>
  <div class="view-toggle" role="tablist" aria-label="View">
    <button id="dayViewBtn" class="toggle-btn active" role="tab" aria-selected="true">Day</button>
    <button id="weekViewBtn" class="toggle-btn" role="tab" aria-selected="false">Week</button>
  </div>
</header>

<nav id="dayTabs" class="day-tabs" aria-label="Choose day"></nav>

<main id="scheduleList" class="schedule-list"></main>

<section id="weekView" class="week-view hidden"></section>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
